    frente: dev
    area: restaurants
    description: "Consultar restaurantes próximos que atendem o tipo convergido (contexto.md §4 e §6)."
    stories:
      - id: E3-S1
        title: "Obter a localização do usuário com permissão"
        sprint: 3
        frente: dev
        area: restaurants
        priority: alta
        estimate: 3
        description: >
          geolocator + permissões Android/iOS + fallback quando negado. Estado negado = tela
          09 Localização negada do Figma (Empty State com Icon/Pin, Button Primary
          "Permitir localização" e Secondary "Abrir ajustes do celular").
        acceptance:
          - "Pede permissão com justificativa clara"
          - "Permissão negada mostra a tela 09 com 'Permitir localização' e 'Abrir ajustes do celular'"
          - "Negada para sempre: o botão principal abre os ajustes do sistema"
      - id: E3-S2
        title: "Buscar restaurantes próximos por tipo de comida (PlacesService)"
        sprint: 3
        frente: dev
        area: restaurants
        priority: alta
        estimate: 5
        description: "Integração com Google Places API (Nearby/Text Search) atrás de interface testável."
        acceptance:
          - "Retorna nome, tipo de cozinha, endereço, coordenadas, distância, avaliação e foto"
          - "Telefone disponível para o botão 'Ligar' (E3-S5), buscado só do restaurante escolhido"
          - "Chave da API fora do código e restrita ao app"
          - "Testes do service com respostas simuladas"
      - id: E3-S3
        title: "Como usuário, quero ver os restaurantes recomendados no mapa"
        sprint: 3
        frente: dev
        area: restaurants
        priority: alta
        estimate: 5
        description: >
          Telas 05 Restaurantes no mapa e 08 Restaurantes carregando do Figma. Mapa centrado
          na pessoa (User Location), um Map Pin por restaurante na cor da comida escolhida,
          chips com a comida e "N lugares em até X km". Tocar num pin o seleciona e mostra a
          prévia (Restaurant Card Layout=Row); tocar na prévia abre o contato (E3-S4). Pacote
          de mapa é dependência nova: decidir no plano com o time (contexto.md §12).
        acceptance:
          - "Mapa e localização aparecem na hora; o chip avisa que a busca está rodando e os pins entram quando o Places responde"
          - "Só um pin selecionado por vez, com balão de nome e nota"
          - "Botão de recentralizar na pessoa"
          - "Estados de vazio (nenhum lugar no raio) e erro com saída"
          - "Fluxo completo swipe → resultado → mapa → contato demonstrável no seminário"
      - id: E3-S4
        title: "Como usuário, quero ver o restaurante escolhido e como pedir"
        sprint: 4
        frente: dev
        area: restaurants
        priority: alta
        estimate: 3
        description: >
          Tela 06 Opções de contato do Figma (substitui a tela de detalhe): Restaurant Card
          Layout=Vertical com nota, distância e tempo, chip "Salvo no seu histórico" (só com
          conta), a pergunta "Como você quer pedir?" com Pedir no delivery, Abrir no mapa e
          Ligar, e os atalhos Ir para o histórico e Voltar ao início.
        acceptance:
          - "Abre a partir da prévia do mapa e o voltar retorna ao mapa com o mesmo pin selecionado"
          - "Com conta, a escolha é salva no histórico ao abrir a tela; visitante não vê o chip nem o atalho do histórico"
          - "'Voltar ao início' leva à Home com a sessão zerada"
      - id: E3-S5
        title: "Como usuário, quero abrir o restaurante no app de delivery ou no mapa"
        sprint: 4
        frente: dev
        area: restaurants
        priority: media
        estimate: 2
        description: >
          Botões da tela 06: url_launcher para Maps, busca do restaurante no app de delivery
          (o preferido nas preferências, E10-S3) e ligação.
        acceptance:
          - "Abre no Google Maps/Apple Maps"
          - "Abre busca pelo nome no app de delivery ou no navegador como fallback"
          - "'Ligar' abre o discador com o telefone do restaurante; sem telefone, o botão não aparece"
      - id: E3-S6
        title: "Como usuário, quero ver os restaurantes também em lista"
        sprint: 5
        frente: dev
        area: restaurants
        priority: media
        estimate: 3
        description: >
          Visualização alternativa ao mapa, com os mesmos resultados e a mesma seleção. O mapa
          continua sendo a tela padrão. Layout desenhado antes pela frente de Produto (E6-S4).
        acceptance:
          - "Alternar entre mapa e lista mantém os resultados sem nova busca"
          - "Lista com Restaurant Card Layout=Row, ordenada pela mesma regra do mapa"
          - "Tocar num item abre o contato (E3-S4)"


# Fonte do backlog do Rango.
#
# Este arquivo é a origem de labels, milestones (sprints) e issues de épicos/histórias.
# Ao ser alterado na `main` (ou via "Run workflow" em Actions > Backlog sync), o script
# .github/scripts/backlog_sync.py cria ou atualiza tudo no GitHub, sem duplicar.
#
# Regras:
# - `id` é a chave estável do item. NÃO mude o id de um item que já virou issue
#   (o script encontra a issue pelo marcador <!-- backlog-id: ... --> no corpo).
# - Mudou título, labels, sprint, descrição ou critérios? Basta editar aqui e rodar o sync.
# - Remover um item daqui NÃO fecha a issue: o sync só avisa. Feche manualmente se for o caso.
# - `done: true` fecha a issue no próximo sync.
# - O corpo da issue só é reescrito quando a descrição/critérios mudam aqui. Discussões
#   ficam nos comentários da issue, não no corpo.
#
# Campos de uma história:
#   id, title, sprint (1..6 ou omitido = backlog futuro), frente (dev|marketing|produto),
#   area, priority (alta|media|baixa), estimate (pontos: 1,2,3,5,8), description,
#   acceptance (lista de critérios), done (opcional)

labels:
  - { name: "type:epic",       color: "5319e7", description: "Épico: agrupa histórias" }
  - { name: "type:story",      color: "1d76db", description: "História de usuário" }
  - { name: "type:task",       color: "0e8a16", description: "Tarefa técnica / sub-issue" }
  - { name: "type:bug",        color: "d73a4a", description: "Algo não funciona como deveria" }
  - { name: "type:sprint",     color: "bfdadc", description: "Issue de acompanhamento da sprint (review/retro)" }
  - { name: "frente:dev",      color: "0052cc", description: "Frente de desenvolvimento do app" }
  - { name: "frente:marketing", color: "e99695", description: "Frente de marketing e divulgação" }
  - { name: "frente:produto",  color: "fbca04", description: "Frente de produto/UX" }
  - { name: "area:infra",      color: "c5def5", description: "Repo, CI, setup, arquitetura" }
  - { name: "area:auth",       color: "c5def5", description: "Sessão anônima / Firebase Auth" }
  - { name: "area:swipe",      color: "c5def5", description: "Fluxo de swipe e convergência" }
  - { name: "area:restaurants", color: "c5def5", description: "Busca e exibição de restaurantes" }
  - { name: "area:docs",       color: "c5def5", description: "Documentação e processo" }
  - { name: "area:ui",         color: "c5def5", description: "Design system no app: tema, ícones, componentes, navegação" }
  - { name: "area:historico",  color: "c5def5", description: "Histórico de rangos decididos" }
  - { name: "area:perfil",     color: "c5def5", description: "Perfil, preferências e dados da conta" }
  - { name: "area:marca",      color: "f9d0c4", description: "Identidade, posicionamento" }
  - { name: "area:canais",     color: "f9d0c4", description: "Redes sociais, landing page, campanhas" }
  - { name: "area:pesquisa",   color: "f9d0c4", description: "Pesquisa e validação com usuários" }
  - { name: "area:pitch",      color: "f9d0c4", description: "Seminário, pitch, apresentação" }
  - { name: "priority:alta",   color: "b60205", description: "" }
  - { name: "priority:media",  color: "fbca04", description: "" }
  - { name: "priority:baixa",  color: "cfd3d7", description: "" }
  - { name: "blocked",         color: "000000", description: "Impedido; explicar no comentário" }

# Sprints de 2 semanas. Cada uma termina na aula de review (data = due_on).
milestones:
  - { sprint: 1, due_on: "2026-09-24", description: "Construção do primeiro incremento (10/09 → 24/09)" }
  - { sprint: 2, due_on: "2026-10-08", description: "Evolução do fluxo principal (24/09 → 08/10)" }
  - { sprint: 3, due_on: "2026-10-22", description: "Consolidação para o seminário de andamento de 22/10 (08/10 → 22/10)" }
  - { sprint: 4, due_on: "2026-11-05", description: "Evolução orientada por feedback do seminário (22/10 → 05/11)" }
  - { sprint: 5, due_on: "2026-11-19", description: "Consolidação funcional e técnica (05/11 → 19/11)" }
  - { sprint: 6, due_on: "2026-12-03", description: "Estabilização e preparação do pitch; apresentação final em 03/12 (19/11 → 03/12)" }

epics:
  - id: E0
    title: "Fundação do projeto (repo, arquitetura, processo)"
    frente: dev
    area: infra
    description: >
      Deixar o repositório pronto para o time trabalhar: gestão no GitHub, projeto Flutter,
      arquitetura MVVM por telas e processo SDD documentado.
    stories:
      - id: E0-S1
        title: "Configurar gestão do projeto no GitHub (backlog, board, templates, CI)"
        sprint: 1
        frente: dev
        area: infra
        priority: alta
        estimate: 3
        done: true
        description: "Backlog versionado, board no Projects, templates de issue/PR, workflows de CI e automação."
        acceptance:
          - "backlog.yml sincroniza labels, milestones e issues sem duplicar"
          - "Issues aparecem no board com Sprint e Frente"
          - "Templates de issue e PR disponíveis"
      - id: E0-S2
        title: "Inicializar projeto Flutter com dependências e lints"
        sprint: 2
        frente: dev
        area: infra
        priority: alta
        estimate: 2
        description: "Seguir docs/guia-setup.md passos 0–2."
        acceptance:
          - "flutter analyze e flutter test passam"
          - "CI roda format, analyze e test no PR"
      - id: E0-S3
        title: "Estruturar arquitetura MVVM por telas com a tela de swipe de exemplo"
        sprint: 2
        frente: dev
        area: infra
        priority: alta
        estimate: 3
        description: "Seguir docs/guia-setup.md passos 3–4 (camadas, exemplos, env)."
        acceptance:
          - "lib/ organizado em app/, core/, models/, data/ e screens/<tela>/ (View + ViewModel)"
          - "Um teste de exemplo por camada passando"
          - "Segredos fora do git (env.json no .gitignore)"
      - id: E0-S4
        title: "Estruturar SDD: AGENTS.md, CLAUDE.md, rules, skills e templates de spec"
        sprint: 2
        frente: dev
        area: docs
        priority: alta
        estimate: 3
        done: true
        description: "Documentação para agentes no padrão do the-final-backend (ver docs/guia-setup.md passo 5)."
        acceptance:
          - "CLAUDE.md e AGENTS.md na raiz, em inglês"
          - "Rules com paths: e skills com SKILL.md + references/, no padrão do the-final-backend"
          - "docs/sdd.md descreve o ciclo e aponta os moldes"

  - id: E1
    title: "Sessão e conta (Firebase Auth)"
    frente: dev
    area: auth
    description: >
      Visitante navega sem cadastro (sessão anônima, nada salvo); quem entra com conta tem
      escolhas, histórico, estatísticas e preferências salvos no Firebase (contexto.md §6, §7 e §11).
    stories:
      - id: E1-S1
        title: "Configurar Firebase no app (flutterfire)"
        sprint: 2
        frente: dev
        area: auth
        priority: alta
        estimate: 2
        description: "Criar/usar o projeto Firebase do time e gerar firebase_options.dart para Android e iOS."
        acceptance:
          - "App inicializa o Firebase em Android e iOS"
          - "Configuração documentada no README"
      - id: E1-S2
        title: "Como usuário, quero começar a usar o app sem cadastro"
        sprint: 2
        frente: dev
        area: auth
        priority: alta
        estimate: 3
        description: >
          Login anônimo automático ao abrir o app, atrás de um AuthRepository. É o modo
          visitante: o app funciona inteiro, mas nada do visitante é salvo (sem histórico,
          estatísticas nem preferências). Avatar Button Type=Guest na Top Bar.
        acceptance:
          - "Ao abrir o app pela primeira vez, uma sessão anônima é criada sem interação"
          - "Reabrir o app reaproveita o mesmo usuário anônimo"
          - "Falha de rede exibe estado de erro com tentar novamente"
          - "Nenhuma escolha do visitante é gravada no Firestore"
      - id: E1-S3
        title: "Como usuário, quero entrar ou criar uma conta para salvar meus rangos"
        sprint: 4
        frente: dev
        area: auth
        priority: alta
        estimate: 5
        description: >
          Botão "Entrar ou criar conta" do Profile Sheet (Figma 11 Perfil). Método de login
          (e-mail, Google, Apple) definido na spec, com as telas desenhadas pela frente de
          Produto (E6-S3). A conta nasce ligando o usuário anônimo atual (linkWithCredential),
          para manter o uid.
        acceptance:
          - "Visitante entra ou cria conta a partir do Profile Sheet"
          - "Depois do login, o Avatar Button e o Profile Sheet mostram a pessoa (Type=Photo quando houver foto)"
          - "Sair da conta volta ao modo visitante"
          - "Erros de login (rede, credencial inválida, conta já existente) têm mensagem e saída"

  - id: E2
    title: "Swipe convergente (do amplo ao específico)"
    frente: dev
    area: swipe
    description: "Sessão de escolhas binárias que afunila até um tipo de comida específico (contexto.md §6)."
    stories:
      - id: E2-S1
        title: "Definir a árvore de categorias de comida (spec 001)"
        sprint: 2
        frente: produto
        area: swipe
        priority: alta
        estimate: 3
        description: >
          Definir níveis, pares de escolha e folhas (tipos de comida que viram busca no Places).
          Pelo Figma (01–03), cada nó também tem a linha de exemplos do Food Card
          ("Coxinha, pastel, pizza"), a cor (modo Food Theme) e a foto.
        acceptance:
          - "Árvore com pelo menos 3 níveis e 12 tipos de comida finais"
          - "Cada folha tem o termo de busca usado no Google Places"
          - "Cada nó tem rótulo, exemplos, cor do Food Theme e foto (ver E8-S7)"
          - "Spec aprovada em PR"
      - id: E2-S2
        title: "Como usuário, quero escolher entre duas opções por swipe até chegar num tipo de comida"
        sprint: 2
        frente: dev
        area: swipe
        priority: alta
        estimate: 5
        description: >
          Telas 01 Home, 02 e 03 do Figma: dois Food Card Size=Hero inclinados com o Sticker
          "ou" entre eles, Page Header com a pergunta do nível. A escolha é por toque ou
          arrastando o card. Home usa Top Bar Principal + Tab Bar; os níveis seguintes, Top Bar
          Fluxo. O ViewModel da tela de swipe de exemplo (E0-S3) já expõe choose/reset.
        acceptance:
          - "Tocar ou arrastar um card escolhe aquela opção (o toque é a alternativa acessível ao gesto)"
          - "Cada escolha avança um nível da árvore, com título e subtítulo do nível"
          - "O voltar da Top Bar desfaz a última escolha; na Home não há voltar"
          - "Cada card usa a cor (Food Theme) e a foto da categoria"
          - "Com 'reduzir movimento' ligado, os cards não animam a entrada"
      - id: E2-S3
        title: "Como usuário, quero ver o tipo de comida em que convergi"
        sprint: 3
        frente: dev
        area: swipe
        priority: alta
        estimate: 2
        description: >
          Tela 04 Deu match do Figma: Food Card Hero da comida final com o caminho e o chip
          "N escolhas", Sticker Lime "Deu match!", Page Header Medium, Button Primary
          "Ver restaurantes perto" e Ghost "Recomeçar".
        acceptance:
          - "Mostra o tipo final e o caminho (ex.: salgado → massa → macarrão)"
          - "'Ver restaurantes perto' leva ao mapa de restaurantes (E3-S3)"
          - "'Recomeçar' volta à Home com a sessão zerada"
      - id: E2-S4
        title: "Salvar sessão e escolhas no Firestore"
        sprint: 4
        frente: dev
        area: swipe
        priority: media
        estimate: 3
        description: >
          Persistir Session e SwipeChoice de quem tem conta (contexto.md §8). Visitante não
          grava nada. A sessão guarda também o restaurante escolhido e o canal do pedido
          (delivery, mapa, ligação), que alimentam o Histórico e o "Pedir de novo".
        acceptance:
          - "Cada sessão concluída por usuário com conta é salva com escolhas, resultado e restaurante escolhido"
          - "Sessão de visitante não é salva"
          - "ViewModel não importa Firestore (acesso via SessionRepository)"

  - id: E3

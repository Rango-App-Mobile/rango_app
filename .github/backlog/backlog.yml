  - id: E8
    title: "Design system no app (Figma → Flutter)"
    frente: dev
    area: ui
    description: >
      Levar para o Flutter o design system do Figma (https://www.figma.com/design/s7aWG29SRZn5tjGGzY6svm):
      tokens, tipografia, ícones, marca e os componentes da página Components. O card de
      Handoff de cada componente diz onde ele mora no código. Tokens em lib/app/theme/,
      widgets compartilhados em lib/core/widgets/. Dependência nova só com o time de acordo.
    stories:
      - id: E8-S1
        title: "Tema do app a partir dos tokens do Figma"
        sprint: 2
        frente: dev
        area: ui
        priority: alta
        estimate: 3
        description: >
          Coleções Primitives, Color, Space & Radius e Food Theme (10 modos), os 13 estilos de
          texto (Bowlby One, Aleo, Lobster) e as sombras Elevation/Card e Elevation/Floating
          viram o AppTheme. Food Theme como ThemeExtension, para um card trocar de cor pelo
          modo da comida como no Figma.
        acceptance:
          - "Tokens com os mesmos nomes do Figma (color/text/secondary, space/md, radius/card...)"
          - "Food Theme aplicável por widget, com os pares bg/on dos 10 modos"
          - "Fontes empacotadas no app (funcionam offline) e licença OFL registrada"
          - "Nenhum hex ou tamanho solto nas telas: tudo vem do tema"
      - id: E8-S2
        title: "Ícones do app (24 ícones do Figma)"
        sprint: 2
        frente: dev
        area: ui
        priority: alta
        estimate: 2
        description: "Exportar os 24 componentes de ✳️ Ícones e usá-los com a cor do tema (color/icon/*)."
        acceptance:
          - "Os 24 ícones disponíveis por nome (ex.: RangoIcons.arrowLeft)"
          - "Tamanho e cor controlados pelo tema, sem arquivo duplicado por cor"
      - id: E8-S3
        title: "Componentes base: Button, Icon Button, Chip, Sticker e Page Header"
        sprint: 2
        frente: dev
        area: ui
        priority: alta
        estimate: 3
        description: "Widgets com as mesmas variantes e propriedades do Figma (Style, Size, Show icon, Color)."
        acceptance:
          - "Button Primary/Secondary/Ghost × Large/Medium, com ícone opcional"
          - "Icon Button Surface/Inverse/Outline com alvo de 48 × 48"
          - "Chip Outline/Solid/Soft, Sticker Mustard/Lime/Bubblegum, Page Header Large/Medium"
          - "Teste de widget por componente e rótulos de acessibilidade"
      - id: E8-S4
        title: "Food Card com Food Theme e foto"
        sprint: 2
        frente: dev
        area: ui
        priority: alta
        estimate: 3
        description: >
          O componente central do Rango: Size=Hero, Medium, Compact e Expanded, com título,
          subtítulo (restaurante ou exemplos), chip opcional, foto recortada e a cor do modo
          Food Theme.
        acceptance:
          - "As 4 variantes do Figma com as propriedades Title, Restaurant, Cuisine, Show chip e Show restaurant"
          - "Trocar o Food Theme troca fundo, texto e chip juntos"
          - "Título em até duas linhas sem estourar o card"
      - id: E8-S5
        title: "Navegação do app: Top Bar, Tab Bar e abas Home/Histórico"
        sprint: 2
        frente: dev
        area: ui
        priority: alta
        estimate: 3
        description: >
          Top Bar Type=Principal (logo + Avatar Button) nas telas raiz e Type=Fluxo (só voltar)
          no resto; Tab Bar flutuante com Tab Item Home e Histórico. go_router com uma pilha
          por aba: o voltar do fluxo retorna à aba de origem.
        acceptance:
          - "Home e Histórico são abas com pilha própria"
          - "Top Bar Principal só nas telas raiz; Fluxo em todas as outras, sem misturar logo e voltar"
          - "Tab Bar some nas telas de fluxo (escolhas, mapa, contato)"
          - "Avatar Button abre o Profile Sheet de qualquer tela raiz"
      - id: E8-S6
        title: "Ícone do app e splash com a marca V2"
        sprint: 3
        frente: dev
        area: ui
        priority: media
        estimate: 2
        description: >
          App Icon Background=Green (principal) para Android e iOS, variante Ink para o ícone
          escuro do iOS, e splash com Logo Layout=Stacked sobre color/bg/canvas. Artes
          exportadas de 🍔 Marca.
        acceptance:
          - "Ícone certo em Android (adaptativo) e iOS, legível em 40 px"
          - "Splash sem salto visual até a primeira tela"
      - id: E8-S7
        title: "Fotos das comidas: seleção, licença e assets"
        sprint: 2
        frente: produto
        area: ui
        priority: alta
        estimate: 2
        description: >
          Uma foto por nó da árvore de categorias (E2-S1), no recorte do Food Card. As fotos
          do Figma são de referência: confirmar licença de uso ou trocar.
        acceptance:
          - "Uma foto por categoria, com fonte e licença registradas em docs/"
          - "Exportadas em tamanho e compressão para app (sem pesar no APK)"
      - id: E8-S8
        title: "Componentes de estado: Empty State, Empty Card, List End e Scrim"
        sprint: 3
        frente: dev
        area: ui
        priority: media
        estimate: 2
        description: "Estados de erro, vazio e fim de lista, e os véus Scrim Top (mapa) e Modal (sheets)."
        acceptance:
          - "Empty State com ícone, título/texto via Page Header Medium e ações fora dele"
          - "Scrim Modal fecha a sheet ao tocar"

  - id: E9
    title: "Histórico de rangos"
    frente: dev
    area: historico
    description: >
      Aba Histórico do Figma (07b, 07d, 10 e 12): tudo que a pessoa com conta decidiu, por mês.
      Entrou no MVP em 2026-09-30 (contexto.md §9 e §11). Visitante não tem histórico salvo.
    stories:
      - id: E9-S1
        title: "Como usuário com conta, quero ver o histórico dos meus rangos"
        sprint: 4
        frente: dev
        area: historico
        priority: alta
        estimate: 5
        description: >
          Telas 07b e 10 do Figma: Page Header "Seu histórico" com a contagem, Month Header
          por mês, um Food Card Medium por decisão (comida, restaurante, data), List End com
          "Decidir o próximo" e o estado vazio com Empty Card e "Decidir meu rango". Lê do
          SessionRepository (E2-S4).
        acceptance:
          - "Decisões agrupadas por mês, da mais recente para a mais antiga"
          - "Estado vazio com ação que leva à Home"
          - "Visitante vê o convite para entrar desenhado em E6-S3, não uma lista vazia"
          - "Carrega por páginas, sem ler o histórico inteiro de uma vez"
      - id: E9-S2
        title: "Como usuário com conta, quero abrir um rango do histórico e pedir de novo"
        sprint: 5
        frente: dev
        area: historico
        priority: media
        estimate: 3
        description: >
          Tela 12 do Figma: o card tocado cresce (Food Card Size=Expanded, transição compartilhada)
          e mostra data e hora, o caminho de escolhas, o restaurante e o canal do pedido, com
          "Pedir de novo" e "Ver no mapa".
        acceptance:
          - "Transição do card da lista para o detalhe; sem animação com 'reduzir movimento'"
          - "'Pedir de novo' repete o canal usado (delivery, mapa ou ligação)"
          - "Voltar retorna ao Histórico na mesma posição"
      - id: E9-S3
        title: "Histórico em pastas (rolagem paginada)"
        sprint: 5
        frente: dev
        area: historico
        priority: baixa
        estimate: 3
        description: >
          Tela 07d do Figma: cards retos empilhados como pastas; a rolagem faz snap card a card
          e o card que sobe é arquivado atrás do próximo, deixando só a aba visível.
        acceptance:
          - "Snap card a card com a aba do card arquivado visível"
          - "Com 'reduzir movimento', vira lista simples"

  - id: E10
    title: "Perfil e preferências"
    frente: dev
    area: perfil
    description: >
      Profile Sheet do Figma (11 Perfil), aberto pelo Avatar Button. Com conta: estatísticas,
      preferências e dados salvos no Firebase. Visitante: só o convite para entrar e o "Sobre".
    stories:
      - id: E10-S1
        title: "Profile Sheet: abrir, fechar e modos visitante/conta"
        sprint: 4
        frente: dev
        area: perfil
        priority: alta
        estimate: 3
        description: >
          Folha que sobe da base (radius/sheet) sobre o Scrim Modal a 45%; fecha pelo X,
          arrastando ou tocando no véu. Cabeçalho com Avatar Button e nome; visitante vê
          "Entrar ou criar conta" (E1-S3).
        acceptance:
          - "Abre pelo Avatar Button e fecha pelos três caminhos"
          - "Visitante: sem estatísticas nem preferências, com o convite para entrar"
          - "Com conta: nome/foto da pessoa no cabeçalho"
      - id: E10-S2
        title: "Como usuário com conta, quero ver minhas estatísticas"
        sprint: 5
        frente: dev
        area: perfil
        priority: media
        estimate: 2
        description: "Três Stat no Profile Sheet: rangos decididos, comida favorita e restaurante favorito, calculados do histórico."
        acceptance:
          - "Valores batem com o histórico salvo"
          - "Sem decisões ainda, os Stat mostram um estado neutro (sem '0' solto)"
      - id: E10-S3
        title: "Como usuário com conta, quero ajustar minhas preferências"
        sprint: 5
        frente: dev
        area: perfil
        priority: media
        estimate: 3
        description: >
          List Row do Profile Sheet: Localização (status + abrir ajustes), Notificações
          (liga/desliga) e App de delivery (qual abrir em "Pedir no delivery"). Salvas por
          usuário no Firestore. O que as notificações avisam está em aberto (contexto.md §12).
        acceptance:
          - "Preferências salvas na conta e aplicadas em outro aparelho após login"
          - "App de delivery escolhido é o usado por E3-S5"
          - "Localização mostra o status real da permissão"
      - id: E10-S4
        title: "Privacidade, Sobre e apagar meus dados"
        sprint: 5
        frente: dev
        area: perfil
        priority: alta
        estimate: 3
        description: >
          Linhas Privacidade e Sobre o Rango (versão do app) e a ação destrutiva "Apagar meus
          dados" (List Row Trailing=Danger), que apaga conta, histórico e preferências.
        acceptance:
          - "'Apagar meus dados' pede confirmação e remove conta e dados do Firestore"
          - "Depois de apagar, o app volta ao modo visitante"
          - "Privacidade explica o uso da localização e o que é salvo"


# Fonte do backlog do Rango.
#
# Este arquivo é a origem de labels, milestones (sprints) e issues de épicos/histórias.
# Ao ser alterado na `main` (ou via "Run workflow" em Actions > Backlog sync), o script
# .github/scripts/backlog_sync.py cria ou atualiza tudo no GitHub, sem duplicar.
#
# Regras:
# - `id` é a chave estável do item. NÃO mude o id de um item que já virou issue
#   (o script encontra a issue pelo marcador <!-- backlog-id: ... --> no corpo).
# - Mudou título, labels, sprint, descrição ou critérios? Basta editar aqui e rodar o sync.
# - Remover um item daqui NÃO fecha a issue: o sync só avisa. Feche manualmente se for o caso.
# - `done: true` fecha a issue no próximo sync.
# - O corpo da issue só é reescrito quando a descrição/critérios mudam aqui. Discussões
#   ficam nos comentários da issue, não no corpo.
#
# Campos de uma história:
#   id, title, sprint (1..6 ou omitido = backlog futuro), frente (dev|marketing|produto),
#   area, priority (alta|media|baixa), estimate (pontos: 1,2,3,5,8), description,
#   acceptance (lista de critérios), done (opcional)

labels:
  - { name: "type:epic",       color: "5319e7", description: "Épico: agrupa histórias" }
  - { name: "type:story",      color: "1d76db", description: "História de usuário" }
  - { name: "type:task",       color: "0e8a16", description: "Tarefa técnica / sub-issue" }
  - { name: "type:bug",        color: "d73a4a", description: "Algo não funciona como deveria" }
  - { name: "type:sprint",     color: "bfdadc", description: "Issue de acompanhamento da sprint (review/retro)" }
  - { name: "frente:dev",      color: "0052cc", description: "Frente de desenvolvimento do app" }
  - { name: "frente:marketing", color: "e99695", description: "Frente de marketing e divulgação" }
  - { name: "frente:produto",  color: "fbca04", description: "Frente de produto/UX" }
  - { name: "area:infra",      color: "c5def5", description: "Repo, CI, setup, arquitetura" }
  - { name: "area:auth",       color: "c5def5", description: "Sessão anônima / Firebase Auth" }
  - { name: "area:swipe",      color: "c5def5", description: "Fluxo de swipe e convergência" }
  - { name: "area:restaurants", color: "c5def5", description: "Busca e exibição de restaurantes" }
  - { name: "area:docs",       color: "c5def5", description: "Documentação e processo" }
  - { name: "area:marca",      color: "f9d0c4", description: "Identidade, posicionamento" }
  - { name: "area:canais",     color: "f9d0c4", description: "Redes sociais, landing page, campanhas" }
  - { name: "area:pesquisa",   color: "f9d0c4", description: "Pesquisa e validação com usuários" }
  - { name: "area:pitch",      color: "f9d0c4", description: "Seminário, pitch, apresentação" }
  - { name: "priority:alta",   color: "b60205", description: "" }
  - { name: "priority:media",  color: "fbca04", description: "" }
  - { name: "priority:baixa",  color: "cfd3d7", description: "" }
  - { name: "blocked",         color: "000000", description: "Impedido; explicar no comentário" }

# Sprints de 2 semanas. Cada uma termina na aula de review (data = due_on).
milestones:
  - { sprint: 1, due_on: "2026-09-24", description: "Construção do primeiro incremento (10/09 → 24/09)" }
  - { sprint: 2, due_on: "2026-10-08", description: "Evolução do fluxo principal (24/09 → 08/10)" }
  - { sprint: 3, due_on: "2026-10-22", description: "Consolidação para o seminário de andamento de 22/10 (08/10 → 22/10)" }
  - { sprint: 4, due_on: "2026-11-05", description: "Evolução orientada por feedback do seminário (22/10 → 05/11)" }
  - { sprint: 5, due_on: "2026-11-19", description: "Consolidação funcional e técnica (05/11 → 19/11)" }
  - { sprint: 6, due_on: "2026-12-03", description: "Estabilização e preparação do pitch; apresentação final em 03/12 (19/11 → 03/12)" }

epics:
  - id: E0
    title: "Fundação do projeto (repo, arquitetura, processo)"
    frente: dev
    area: infra
    description: >
      Deixar o repositório pronto para o time trabalhar: gestão no GitHub, projeto Flutter,
      arquitetura MVVM feature-first e processo SDD documentado.
    stories:
      - id: E0-S1
        title: "Configurar gestão do projeto no GitHub (backlog, board, templates, CI)"
        sprint: 1
        frente: dev
        area: infra
        priority: alta
        estimate: 3
        done: true
        description: "Backlog versionado, board no Projects, templates de issue/PR, workflows de CI e automação."
        acceptance:
          - "backlog.yml sincroniza labels, milestones e issues sem duplicar"
          - "Issues aparecem no board com Sprint e Frente"
          - "Templates de issue e PR disponíveis"
      - id: E0-S2
        title: "Inicializar projeto Flutter com dependências e lints"
        sprint: 2
        frente: dev
        area: infra
        priority: alta
        estimate: 2
        description: "Seguir docs/guia-setup.md passos 0–2."
        acceptance:
          - "flutter analyze e flutter test passam"
          - "CI roda format, analyze e test no PR"
      - id: E0-S3
        title: "Estruturar arquitetura MVVM feature-first com exemplos por camada"
        sprint: 2
        frente: dev
        area: infra
        priority: alta
        estimate: 3
        description: "Seguir docs/guia-setup.md passos 3–4 (camadas, exemplos, env)."
        acceptance:
          - "lib/ organizado em app/, core/ e features/<feature>/{model,data,view_model,view}"
          - "Um teste de exemplo por camada passando"
          - "Segredos fora do git (env.json no .gitignore)"
      - id: E0-S4
        title: "Estruturar SDD: AGENTS.md, CLAUDE.md, rules, skills e templates de spec"
        sprint: 2
        frente: dev
        area: docs
        priority: alta
        estimate: 3
        description: "Documentação para agentes no padrão do the-final-backend (ver docs/guia-setup.md passo 5)."
        acceptance:
          - "CLAUDE.md e AGENTS.md na raiz, em inglês"
          - "Rules com paths: e skills com SKILL.md + references/, no padrão do the-final-backend"
          - "docs/sdd.md descreve o ciclo e aponta os moldes"


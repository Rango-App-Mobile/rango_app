name: História de usuário
description: Funcionalidade vista pelo usuário (fora do roadmap do backlog.yml, ex. vinda de feedback)
title: "Como <usuário>, quero <ação> para <benefício>"
labels: ["type:story"]
body:
  - type: dropdown
    id: frente
    attributes:
      label: Frente
      options: [dev, marketing, produto]
    validations: { required: true }
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Por que isso importa? Cite a seção de docs/contexto.md quando houver.
    validations: { required: true }
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceitação
      value: |
        - [ ] 
    validations: { required: true }
  - type: input
    id: spec
    attributes:
      label: Spec
      description: Caminho da spec quando existir (docs/specs/NNN-slug/spec.md)
  - type: dropdown
    id: estimativa
    attributes:
      label: Estimativa (pontos)
      options: ["1", "2", "3", "5", "8", "não sei"]
